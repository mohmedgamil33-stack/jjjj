name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Locate project
        run: |
          if [ -f GlassPlayer.zip ]; then
            unzip -q GlassPlayer.zip -d _proj
            echo "DIR=_proj/GlassPlayer" >> "$GITHUB_ENV"
          elif [ -f settings.gradle.kts ]; then
            echo "DIR=." >> "$GITHUB_ENV"
          elif [ -f GlassPlayer/settings.gradle.kts ]; then
            echo "DIR=GlassPlayer" >> "$GITHUB_ENV"
          else
            echo "Project not found"; exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
